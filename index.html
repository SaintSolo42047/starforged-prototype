<script>
// Complete Starforged 3D - smooth terrain with perlin-like noise, all controls, accessibility fixes
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x112211, 300, 2200);
scene.background = new THREE.Color(0x112244);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);

scene.add(new THREE.AmbientLight(0xaaaaaa, 1.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.8);
dirLight.position.set(200, 300, 100);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x88aaff, 1.6);
fillLight.position.set(-200, 150, -150);
scene.add(fillLight);
const hemiLight = new THREE.HemisphereLight(0xaaccff, 0x334422, 0.9);
scene.add(hemiLight);

// World types with color palettes and height variance for variation
const worldTypes = [
    {name: "Barren World", colors: [0x666666, 0x777777, 0x888888], heightVar: 2.0},
    {name: "Frozen World", colors: [0xaabbff, 0xccddff, 0x99bbff], heightVar: 1.5},
    {name: "Arid World", colors: [0xffeecc, 0xffd9a3, 0xffe6b3], heightVar: 2.5},
    {name: "Oceanic World", colors: [0x2288dd, 0x3399ff, 0x1177cc], heightVar: 1.2},
    {name: "Arboreal World", colors: [0x44aa55, 0x55bb66, 0x339944], heightVar: 2.2},
    {name: "Earthlike World", colors: [0x55bb66, 0x66cc77, 0x44aa55], heightVar: 2.0},
    {name: "Volcanic World", colors: [0xdd7744, 0xee8855, 0xcc6633], heightVar: 3.0},
    {name: "Metallic World", colors: [0xaaaaaa, 0xbbbbbb, 0x999999], heightVar: 1.8}
];

let currentPlanet = {...worldTypes[5]};

const mapSize = 2000;
const blockSize = 32;
const gridSize = 64;
const mapBounds = (gridSize / 2) * blockSize;
let terrainBlocks = [];
let effectsGroup = new THREE.Group();
scene.add(effectsGroup);

// Smooth interpolation function for perlin-like noise
function smoothstep(t) {
    return t * t * (3 - 2 * t);
}

// Perlin-like noise using interpolation
function perlinNoise(x, z) {
    const xi = Math.floor(x);
    const zi = Math.floor(z);
    const xf = x - xi;
    const zf = z - zi;
    
    const u = smoothstep(xf);
    const v = smoothstep(zf);
    
    const grad = (gx, gz) => {
        const seed = gx * 73856093 ^ gz * 19349663;
        return Math.sin(seed) * 0.5;
    };
    
    const n00 = grad(xi, zi);
    const n10 = grad(xi + 1, zi);
    const n01 = grad(xi, zi + 1);
    const n11 = grad(xi + 1, zi + 1);
    
    const nx0 = n00 * (1 - u) + n10 * u;
    const nx1 = n01 * (1 - u) + n11 * u;
    return nx0 * (1 - v) + nx1 * v;
}

function getTerrainHeight(worldX, worldZ) {
    const hVar = currentPlanet.heightVar || 2.0;
    
    let height = perlinNoise(worldX / 200, worldZ / 180) * hVar * 0.6 +
                 perlinNoise(worldX / 400, worldZ / 360) * hVar * 0.3 +
                 perlinNoise(worldX / 100, worldZ / 90) * hVar * 0.1;
    
    return Math.max(1, Math.floor(height + 1)) * blockSize;
}

function getTerrainColor(worldX, worldZ) {
    const colorIndex = Math.abs(Math.floor(worldX / 60) + Math.floor(worldZ / 60)) % currentPlanet.colors.length;
    const baseColor = currentPlanet.colors[colorIndex];
    
    return baseColor;
}

function generateTerrain() {
    terrainBlocks.forEach(b => scene.remove(b));
    terrainBlocks = [];
    for (let x = 0; x < gridSize; x++) {
        for (let z = 0; z < gridSize; z++) {
            const worldX = (x - gridSize/2) * blockSize;
            const worldZ = (z - gridSize/2) * blockSize;
            const heightBlocks = getTerrainHeight(worldX, worldZ) / blockSize;
            
            for (let y = 0; y < heightBlocks; y++) {
                const block = new THREE.Mesh(
                    new THREE.BoxGeometry(blockSize, blockSize, blockSize),
                    new THREE.MeshPhongMaterial({ color: getTerrainColor(worldX, worldZ), flatShading: true })
                );
                block.position.set(worldX, y * blockSize + blockSize/2, worldZ);
                scene.add(block);
                terrainBlocks.push(block);
            }
        }
    }
}
generateTerrain();

const villageGroup = new THREE.Group();
function generateVillages() {
    villageGroup.clear();
    for (let i = 0; i < 8; i++) {
        const villageX = (Math.random() - 0.5) * mapSize * 0.8;
        const villageZ = (Math.random() - 0.5) * mapSize * 0.8;
        const house = new THREE.Mesh(new THREE.BoxGeometry(30, 25, 30), new THREE.MeshPhongMaterial({ color: 0x884422 }));
        house.position.set(villageX, 12.5, villageZ);
        villageGroup.add(house);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(22, 15, 4), new THREE.MeshPhongMaterial({ color: 0x662211 }));
        roof.position.set(villageX, 32, villageZ);
        roof.rotation.y = Math.PI / 4;
        villageGroup.add(roof);
        for (let v = 0; v < 3; v++) {
            const villager = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 18, 8), new THREE.MeshPhongMaterial({ color: 0xffaa66 }));
            body.position.y = 15;
            villager.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(6, 12, 12), new THREE.MeshPhongMaterial({ color: 0xffddaa }));
            head.position.y = 30;
            villager.add(head);
            villager.position.set(villageX + (Math.random()-0.5)*40, 0, villageZ + (Math.random()-0.5)*40);
            villageGroup.add(villager);
        }
    }
    scene.add(villageGroup);
}
generateVillages();

const human = new THREE.Group();
const humanBody = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 20, 8), new THREE.MeshPhongMaterial({ color: 0x2288ff }));
humanBody.position.y = 15;
human.add(humanBody);
const humanHead = new THREE.Mesh(new THREE.SphereGeometry(8, 16, 16), new THREE.MeshPhongMaterial({ color: 0xffddaa }));
humanHead.position.y = 32;
human.add(humanHead);
scene.add(human);

const ship = new THREE.Group();
const shipBody = new THREE.Mesh(new THREE.ConeGeometry(18, 60, 4), new THREE.MeshPhongMaterial({ color: 0x00ffff }));
shipBody.rotation.x = Math.PI / 2;
ship.add(shipBody);
const shipWings = new THREE.Mesh(new THREE.BoxGeometry(80, 8, 18), new THREE.MeshPhongMaterial({ color: 0x0088ff }));
ship.add(shipWings);
scene.add(ship);

let gameState = "playing";
let controlMode = "in_ship";
let playerYaw = Math.PI;
let cameraPitch = 0.4;
let currentSituation = "travel";
let travelInProgress = false;

const char = { 
    stats: { Edge: 2, Heart: 2, Iron: 2, Shadow: 2, Wits: 2 }, 
    meters: { Health: 5, Spirit: 5, Supply: 5, Momentum: 2 }, 
    progress: 0 
};

const oracles = {
    travel: ["Smooth hyperspace jump", "Pirate intercept", "Derelict signal", "Nebula interference"],
    combat: ["Enemy fighter engages", "Shield overload", "You gain targeting lock", "Hull breach sustained"],
    conversation: ["Station hails peacefully", "Captain demands tribute", "AI reveals coordinates", "Faction turns hostile"],
    obstacle: ["Asteroid field clears", "System glitch arises", "Partial scan success", "Full system failure with cost"]
};

let rollResult = null;
let lastReaction = "";
let rolling = false;
let rollFrame = 0;
let keys = {};
let lastProgressUpdate = 0;
let lastKeyE = false;
let lastKeyT = false;
let lastKeyL = false;
let lastKeyR = false;

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function randomChoice(arr) { 
    return arr[Math.floor(Math.random() * arr.length)]; 
}

function ironswornRoll(stat) {
    const action = Math.floor(Math.random() * 6) + 1;
    const c1 = Math.floor(Math.random() * 10) + 1;
    const c2 = Math.floor(Math.random() * 10) + 1;
    const total = action + stat;
    if (total > Math.max(c1, c2)) return {text: "Strong Hit", action, c1, c2};
    if (total > Math.min(c1, c2)) return {text: "Weak Hit", action, c1, c2};
    return {text: "Miss", action, c1, c2};
}

function clearEffects() {
    effectsGroup.children.forEach(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
            if (Array.isArray(child.material)) {
                child.material.forEach(m => m.dispose());
            } else {
                child.material.dispose();
            }
        }
    });
    effectsGroup.clear();
}

function generateEffectForRoll(situation, outcome) {
    const target = controlMode === "on_foot" ? human : ship;
    const planetName = currentPlanet.name;
    let effects = [];

    // Context-aware effects based on situation and outcome
    if (situation === "travel") {
        if (outcome === "Strong Hit") {
            // Successful travel: wormhole effect
            effects.push({
                type: "wormhole",
                position: {x: target.position.x + 50, y: target.position.y + 100, z: target.position.z + 50}
            });
            effects.push({
                type: "starfield",
                position: {x: target.position.x - 100, y: target.position.y, z: target.position.z - 100}
            });
        } else if (outcome === "Weak Hit") {
            // Risky travel: turbulence
            effects.push({
                type: "turbulence",
                position: {x: target.position.x, y: target.position.y + 50, z: target.position.z}
            });
        } else {
            // Failed travel: danger/debris
            effects.push({
                type: "debris_field",
                position: {x: target.position.x, y: target.position.y + 80, z: target.position.z}
            });
            effects.push({
                type: "danger_indicator",
                position: {x: target.position.x + 60, y: target.position.y + 40, z: target.position.z}
            });
        }
    } else if (situation === "combat") {
        if (outcome === "Strong Hit") {
            // Winning combat: enemy explosion
            effects.push({
                type: "explosion",
                position: {x: target.position.x + 80, y: target.position.y + 60, z: target.position.z}
            });
            effects.push({
                type: "laser_burst",
                position: {x: target.position.x, y: target.position.y + 20, z: target.position.z}
            });
        } else if (outcome === "Weak Hit") {
            // Struggling combat: shield flare
            effects.push({
                type: "shield_flare",
                position: {x: target.position.x, y: target.position.y + 30, z: target.position.z}
            });
        } else {
            // Losing combat: incoming fire
            effects.push({
                type: "incoming_fire",
                position: {x: target.position.x - 100, y: target.position.y + 100, z: target.position.z}
            });
        }
    } else if (situation === "conversation") {
        if (outcome === "Strong Hit") {
            // Good negotiation: hologram
            effects.push({
                type: "hologram",
                position: {x: target.position.x + 40, y: target.position.y + 40, z: target.position.z}
            });
        } else if (outcome === "Weak Hit") {
            // Tense negotiation: signal
            effects.push({
                type: "signal_ping",
                position: {x: target.position.x, y: target.position.y + 50, z: target.position.z}
            });
        } else {
            // Failed negotiation: hostile action
            effects.push({
                type: "alarm",
                position: {x: target.position.x, y: target.position.y + 50, z: target.position.z}
            });
            effects.push({
                type: "red_alert",
                position: {x: target.position.x + 40, y: target.position.y + 30, z: target.position.z}
            });
        }
    } else if (situation === "obstacle") {
        if (outcome === "Strong Hit") {
            // Overcame obstacle: environmental clearing
            if (planetName.includes("Frozen")) {
                effects.push({
                    type: "ice_break",
                    position: {x: target.position.x, y: target.position.y - 50, z: target.position.z}
                });
            } else if (planetName.includes("Volcanic")) {
                effects.push({
                    type: "lava_calm",
                    position: {x: target.position.x, y: target.position.y - 80, z: target.position.z}
                });
            } else {
                effects.push({
                    type: "particle_cleared",
                    position: {x: target.position.x, y: target.position.y, z: target.position.z}
                });
            }
        } else if (outcome === "Weak Hit") {
            // Partial obstacle: storm brewing
            effects.push({
                type: "storm_cloud",
                position: {x: target.position.x, y: target.position.y + 150, z: target.position.z}
            });
        } else {
            // Failed obstacle: major hazard
            if (planetName.includes("Frozen")) {
                effects.push({
                    type: "blizzard",
                    position: {x: target.position.x, y: target.position.y + 100, z: target.position.z}
                });
            } else if (planetName.includes("Oceanic")) {
                effects.push({
                    type: "whirlpool",
                    position: {x: target.position.x, y: target.position.y + 50, z: target.position.z}
                });
            } else if (planetName.includes("Volcanic")) {
                effects.push({
                    type: "lava_eruption",
                    position: {x: target.position.x - 100, y: target.position.y, z: target.position.z}
                });
            } else {
                effects.push({
                    type: "earthquake",
                    position: {x: target.position.x, y: target.position.y, z: target.position.z}
                });
            }
        }
    }

    // Render the effects
    effects.forEach(effect => renderEffect(effect));
}

function renderEffect(effect) {
    const pos = effect.position;

    if (effect.type === "wormhole") {
        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(80, 15, 32, 64),
            new THREE.MeshPhongMaterial({ color: 0x00ff00, emissive: 0x00ff00, wireframe: true })
        );
        ring.position.set(pos.x, pos.y, pos.z);
        ring.rotation.x = Math.random() * Math.PI;
        effectsGroup.add(ring);

        // Second rotating ring
        const ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(100, 8, 32, 64),
            new THREE.MeshPhongMaterial({ color: 0x00ff88, emissive: 0x00ff88, wireframe: true })
        );
        ring2.position.set(pos.x, pos.y, pos.z);
        ring2.rotation.z = Math.random() * Math.PI;
        effectsGroup.add(ring2);

    } else if (effect.type === "starfield") {
        for (let i = 0; i < 20; i++) {
            const star = new THREE.Mesh(
                new THREE.SphereGeometry(2, 4, 4),
                new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0xffff00 })
            );
            star.position.set(
                pos.x + (Math.random() - 0.5) * 200,
                pos.y + (Math.random() - 0.5) * 200,
                pos.z + (Math.random() - 0.5) * 200
            );
            effectsGroup.add(star);
        }

    } else if (effect.type === "turbulence") {
        for (let i = 0; i < 15; i++) {
            const particle = new THREE.Mesh(
                new THREE.SphereGeometry(3, 8, 8),
                new THREE.MeshPhongMaterial({ color: 0xff8800, emissive: 0xff8800 })
            );
            particle.position.set(
                pos.x + (Math.random() - 0.5) * 150,
                pos.y + (Math.random() - 0.5) * 150,
                pos.z + (Math.random() - 0.5) * 150
            );
            effectsGroup.add(particle);
        }

    } else if (effect.type === "debris_field") {
        for (let i = 0; i < 30; i++) {
            const debris = new THREE.Mesh(
                new THREE.BoxGeometry(5 + Math.random() * 10, 5 + Math.random() * 10, 5 + Math.random() * 10),
                new THREE.MeshPhongMaterial({ color: 0x666666 })
            );
            debris.position.set(
                pos.x + (Math.random() - 0.5) * 200,
                pos.y + (Math.random() - 0.5) * 150,
                pos.z + (Math.random() - 0.5) * 200
            );
            debris.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            effectsGroup.add(debris);
        }

    } else if (effect.type === "danger_indicator") {
        const warning = new THREE.Mesh(
            new THREE.OctahedronGeometry(30, 2),
            new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0xff0000, wireframe: true })
        );
        warning.position.set(pos.x, pos.y, pos.z);
        effectsGroup.add(warning);

    } else if (effect.type === "explosion") {
        for (let i = 0; i < 50; i++) {
            const flame = new THREE.Mesh(
                new THREE.SphereGeometry(3 + Math.random() * 8, 8, 8),
                new THREE.MeshPhongMaterial({ 
                    color: Math.random() > 0.5 ? 0xff5500 : 0xffaa00, 
                    emissive: Math.random() > 0.5 ? 0xff5500 : 0xffaa00 
                })
            );
            flame.position.set(
                pos.x + (Math.random() - 0.5) * 100,
                pos.y + (Math.random() - 0.5) * 100,
                pos.z + (Math.random() - 0.5) * 100
            );
            effectsGroup.add(flame);
        }

    } else if (effect.type === "laser_burst") {
        for (let i = 0; i < 8; i++) {
            const laser = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 2, 80, 8),
                new THREE.MeshPhongMaterial({ color: 0x00ff00, emissive: 0x00ff00 })
            );
            laser.position.set(pos.x, pos.y, pos.z);
            laser.rotation.z = (i / 8) * Math.PI * 2;
            laser.translateZ(50);
            effectsGroup.add(laser);
        }

    } else if (effect.type === "shield_flare") {
        const shield = new THREE.Mesh(
            new THREE.IcosahedronGeometry(60, 4),
            new THREE.MeshPhongMaterial({ color: 0x0099ff, emissive: 0x0099ff, wireframe: true, transparent: true, opacity: 0.6 })
        );
        shield.position.set(pos.x, pos.y, pos.z);
        effectsGroup.add(shield);

    } else if (effect.type === "incoming_fire") {
        for (let i = 0; i < 10; i++) {
            const bolt = new THREE.Mesh(
                new THREE.CylinderGeometry(1, 1, 40, 6),
                new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0xff0000 })
            );
            bolt.position.set(
                pos.x + (Math.random() - 0.5) * 80,
                pos.y + (Math.random() - 0.5) * 80,
                pos.z + (Math.random() - 0.5) * 80
            );
            bolt.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            effectsGroup.add(bolt);
        }

    } else if (effect.type === "hologram") {
        const holo = new THREE.Mesh(
            new THREE.IcosahedronGeometry(30, 3),
            new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x00ffff, wireframe: true, transparent: true, opacity: 0.7 })
        );
        holo.position.set(pos.x, pos.y, pos.z);
        effectsGroup.add(holo);

        // Add data points around hologram
        for (let i = 0; i < 5; i++) {
            const dataPoint = new THREE.Mesh(
                new THREE.TetrahedronGeometry(5),
                new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x00ffff })
            );
            dataPoint.position.set(
                pos.x + Math.cos((i / 5) * Math.PI * 2) * 50,
                pos.y + Math.sin((i / 5) * Math.PI * 2) * 50,
                pos.z
            );
            effectsGroup.add(dataPoint);
        }

    } else if (effect.type === "signal_ping") {
        const ping = new THREE.Mesh(
            new THREE.TorusGeometry(40, 3, 16, 32),
            new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0xffff00 })
        );

        effectsGroup.add(ping);

    } else if (effect.type === "alarm") {

    } else if (effect.type === "red_alert") {

    } else if (effect.type === "ice_break") {

                new THREE.MeshPhongMaterial({ color: 0xaabbff, emissive: 0x5588ff })

            ice.position.set(
                pos.x + (Math.random() - 0.5) * 180,
                pos.y + (Math.random() - 0.5) * 100,
                pos.z + (Math.random() - 0.5) * 180
            );
            ice.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            effectsGroup.add(ice);
        }

    } else if (effect.type === "lava_calm") {
        for (let i = 0; i < 15; i++) {
            const steam = new THREE.Mesh(
                new THREE.SphereGeometry(8 + Math.random() * 15, 8, 8),
                new THREE.MeshPhongMaterial({ 
                    color: 0xffaa55, 
                    emissive: 0xff6633,
                    transparent: true,
                    opacity: 0.6
                })
            );
            steam.position.set(
                pos.x + (Math.random() - 0.5) * 180,
                pos.y + (Math.random() - 0.5) * 150,
                pos.z + (Math.random() - 0.5) * 180
            );
            effectsGroup.add(steam);
        }

    } else if (effect.type === "particle_cleared") {
        for (let i = 0; i < 20; i++) {
            const particle = new THREE.Mesh(
                new THREE.SphereGeometry(2 + Math.random() * 4, 6, 6),

            );
            particle.position.set(
                pos.x + (Math.random() - 0.5) * 150,

            );
            effectsGroup.add(particle);
        }

    } else if (effect.type === "storm_cloud") {
        for (let i = 0; i < 12; i++) {
            const cloud = new THREE.Mesh(
                new THREE.SphereGeometry(20 + Math.random() * 40, 8, 8),
                new THREE.MeshPhongMaterial({ 
                    color: 0x444444, 
                    emissive: 0x222222,
                    transparent: true,

                })
            );

            );

    } else if (effect.type === "blizzard") {
        for (let i = 0; i < 80; i++) {

            );

        }

    } else if (effect.type === "whirlpool") {
        for (let i = 0; i < 40; i++) {
            const water = new THREE.Mesh(
                new THREE.IcosahedronGeometry(8, 1),
                new THREE.MeshPhongMaterial({ color: 0x1166dd, emissive: 0x0044aa })

                })

            );

}

function updateHUD() {
    let html = '';
    Object.keys(char.meters).forEach(key => {
        const val = char.meters[key];
        const perc = key === "Momentum" ? ((val + 6) / 16 * 100) : (val / 5 * 100);
        const barColor = key === "Health" ? "#f00" : key === "Spirit" ? "#f0f" : key === "Supply" ? "#0f0" : "#0ff";
        html += `<div style="display:flex;align-items:center;margin:4px 0;"><span style="width:90px;">${key}: ${val}</span><div style="flex:1;background:#333;height:12px;border-radius:6px;overflow:hidden;display:inline-block;"><div style="width:${perc}%;height:100%;background:${barColor};"></div></div></div>`;
    });
    document.getElementById('meters').innerHTML = html;
    
    const progressPerc = (char.progress / 10) * 100;
    document.getElementById('progress').innerHTML = `Progress: <span style="color:#0f0;">${char.progress}/10</span><div style="background:#333;height:14px;border-radius:7px;overflow:hidden;display:inline-block;width:100%;"><div style="width:${progressPerc}%;height:100%;background:#0f0;"></div></div>`;
    
    document.getElementById('planetInfo').innerHTML = `Planet: <span style="color:#ff0;">${currentPlanet.name}</span>`;
    document.getElementById('situationText').textContent = currentSituation.toUpperCase();
}

function createEngineTrail(startPos, endPos, duration) {
    let elapsed = 0;
    const trailGroup = new THREE.Group();
    scene.add(trailGroup);

    const segments = 20;
    for (let i = 0; i < segments; i++) {
        const t = i / segments;
        const x = startPos.x + (endPos.x - startPos.x) * t;
        const y = startPos.y + (endPos.y - startPos.y) * t;
        const z = startPos.z + (endPos.z - startPos.z) * t;

        const particle = new THREE.Mesh(
            new THREE.SphereGeometry(8 + Math.random() * 12, 8, 8),
            new THREE.MeshPhongMaterial({ 
                color: Math.random() > 0.5 ? 0xff6600 : 0xffaa00, 
                emissive: Math.random() > 0.5 ? 0xff6600 : 0xffaa00,
                transparent: true,
                opacity: 0.8
            })
        );
        particle.position.set(x, y, z);
        particle.velocityX = (Math.random() - 0.5) * 5;
        particle.velocityY = (Math.random() - 0.5) * 5;
        particle.velocityZ = (Math.random() - 0.5) * 5;
        particle.life = duration;
        trailGroup.add(particle);
    }

    // Animate trail
    const trailInterval = setInterval(() => {
        elapsed += 16;
        trailGroup.children.forEach(p => {
            p.position.x += p.velocityX;
            p.position.y += p.velocityY;
            p.position.z += p.velocityZ;
            p.life -= 16;
            p.material.opacity = Math.max(0, (p.life / duration) * 0.8);
            p.velocityY -= 0.2; // gravity
        });

        if (elapsed > duration) {
            clearInterval(trailInterval);
            trailGroup.children.forEach(p => {
                if (p.geometry) p.geometry.dispose();
                if (p.material) p.material.dispose();
            });
            scene.remove(trailGroup);
        }
    }, 16);
}

function travelToNewPlanet() {
    if (travelInProgress) return;
    travelInProgress = true;

    const startPos = ship.position.clone();
    const statusDiv = document.getElementById('travelStatus');
    statusDiv.style.display = 'block';

    // Takeoff phase (2 seconds)
    let takeoffTime = 0;
    const takeoffDuration = 2000;

    const takeoffInterval = setInterval(() => {
        takeoffTime += 16;
        const progress = takeoffTime / takeoffDuration;

        document.getElementById('travelStatusText').textContent = `ENGAGING THRUSTERS... ${Math.floor(progress * 100)}%`;

        // Move ship upward and forward
        ship.position.y = startPos.y + progress * 400;
        ship.position.z = startPos.z + progress * 200;
        
        // Add rotation for dramatic effect
        ship.rotation.x = progress * 0.3;

        // Create engine trails every frame during takeoff
        if (Math.random() > 0.3) {
            createEngineTrail(
                {x: ship.position.x - 20, y: ship.position.y - 30, z: ship.position.z},
                {x: ship.position.x - 20 + (Math.random() - 0.5) * 50, y: ship.position.y - 100, z: ship.position.z + (Math.random() - 0.5) * 50},
                800
            );
        }

        if (takeoffTime >= takeoffDuration) {
            clearInterval(takeoffInterval);

            // Space travel phase (2 seconds) - warp effect
            let warpTime = 0;
            const warpDuration = 2000;

            const warpInterval = setInterval(() => {
                warpTime += 16;
                const warpProgress = warpTime / warpDuration;

                document.getElementById('travelStatusText').textContent = `ENGAGING WARP DRIVE... ${Math.floor(warpProgress * 100)}%`;

                // Fast horizontal movement
                ship.position.x += Math.sin(warpTime / 100) * 8;
                ship.position.y += 400;

                // Spin effect
                ship.rotation.y += 0.1;
                ship.rotation.z += 0.05;

                if (warpTime >= warpDuration) {
                    clearInterval(warpInterval);

                    // Landing phase (2 seconds)
                    const newPlanet = {...worldTypes[Math.floor(Math.random() * worldTypes.length)]};
                    currentPlanet = newPlanet;
                    generateTerrain();
                    generateVillages();

                    let landingTime = 0;
                    const landingDuration = 2000;
                    const landingStartPos = ship.position.clone();
                    const landingY = 80;

                    const landingInterval = setInterval(() => {
                        landingTime += 16;
                        const landingProgress = landingTime / landingDuration;

                        document.getElementById('travelStatusText').textContent = `ARRIVING AT ${currentPlanet.name.toUpperCase()}... ${Math.floor(landingProgress * 100)}%`;

                        // Descend
                        ship.position.y = landingStartPos.y - landingProgress * (landingStartPos.y - landingY);

                        // Slow rotation
                        ship.rotation.x = (1 - landingProgress) * 0.3;
                        ship.rotation.y = landingStartPos.y * (1 - landingProgress) * 0.02;
                        ship.rotation.z = 0;

                        // Landing trail
                        if (Math.random() > 0.2) {
                            createEngineTrail(
                                {x: ship.position.x + (Math.random() - 0.5) * 40, y: ship.position.y + 50, z: ship.position.z + (Math.random() - 0.5) * 40},
                                {x: ship.position.x + (Math.random() - 0.5) * 40, y: ship.position.y - 80, z: ship.position.z + (Math.random() - 0.5) * 40},
                                600
                            );
                        }

                        if (landingTime >= landingDuration) {
                            clearInterval(landingInterval);
                            statusDiv.style.display = 'none';

                            // Roll dice for travel
                            rollResult = ironswornRoll(char.stats.Wits);
                            lastReaction = randomChoice(oracles.travel);

                            const diceEl = document.getElementById('dice');
                            diceEl.style.display = 'block';
                            document.getElementById('diceAction').textContent = rollResult.action;
                            document.getElementById('diceC1').textContent = rollResult.c1;
                            document.getElementById('diceC2').textContent = rollResult.c2;
                            
                            const outcomeColor = rollResult.text === "Strong Hit" ? "#0f0" : rollResult.text === "Weak Hit" ? "#ff0" : "#f00";
                            document.getElementById('outcomeText').innerHTML = `<span style="color:${outcomeColor};">${rollResult.text}</span>`;
                            document.getElementById('reaction').innerHTML = `<b>Reaction:</b><br>${lastReaction}`;
                            document.getElementById('reaction').style.display = 'block';

                            updateHUD();
                            travelInProgress = false;
                        }
                    }, 16);
                }
            }, 16);
        }
    }, 16);
}

function wrapPosition(pos) {
    const bounds = mapBounds;
    if (pos.x > bounds) pos.x -= bounds * 2;
    if (pos.x < -bounds) pos.x += bounds * 2;
    if (pos.z > bounds) pos.z -= bounds * 2;
    if (pos.z < -bounds) pos.z += bounds * 2;
    return pos;
}

function animate() {
    requestAnimationFrame(animate);
    const speed = 5;
    const verticalSpeed = 3;
    const target = controlMode === "on_foot" ? human : ship;

    if (gameState === "playing" && !travelInProgress) {
        // Rotation control with Shift
        if (keys["Shift"]) {
            if (keys["ArrowLeft"]) playerYaw -= 0.05;
            if (keys["ArrowRight"]) playerYaw += 0.05;
            target.rotation.y = playerYaw;
        }

        // Camera pitch control
        if (keys["q"] || keys["Q"]) cameraPitch = Math.min(1.2, cameraPitch + 0.03);
        if (keys["z"] || keys["Z"]) cameraPitch = Math.max(-0.6, cameraPitch - 0.03);

        // Movement calculations
        const forwardX = Math.sin(playerYaw);
        const forwardZ = Math.cos(playerYaw);
        const strafeX = Math.sin(playerYaw + Math.PI / 2);
        const strafeZ = Math.cos(playerYaw + Math.PI / 2);

        if (keys["ArrowUp"]) { target.position.x += forwardX * speed; target.position.z += forwardZ * speed; }
        if (keys["ArrowDown"]) { target.position.x -= forwardX * speed; target.position.z -= forwardZ * speed; }
        if (keys["ArrowLeft"]) { target.position.x += strafeX * speed * 0.7; target.position.z += strafeZ * speed * 0.7; }
        if (keys["ArrowRight"]) { target.position.x -= strafeX * speed * 0.7; target.position.z -= strafeZ * speed * 0.7; }

        wrapPosition(target.position);

        // Vertical movement for ship only
        if (controlMode === "in_ship") {
            if (keys[" "]) { target.position.y += verticalSpeed; }
            if (keys["Control"] || keys["control"]) { target.position.y -= verticalSpeed; }
        }

        // Terrain collision for on-foot
        if (controlMode === "on_foot") {
            const groundY = getTerrainHeight(target.position.x, target.position.z);
            target.position.y = groundY + 15;
        }

        // E key - debounced - enter/exit ship
        const currentKeyE = keys["e"] || keys["E"];
        if (currentKeyE && !lastKeyE) {
            if (controlMode === "on_foot") {
                const dist = human.position.distanceTo(ship.position);
                if (dist < 50) {
                    controlMode = "in_ship";
                    human.visible = false;
                    playerYaw = ship.rotation.y;
                }
            } else {
                controlMode = "on_foot";
                human.position.copy(ship.position);
                human.position.y = getTerrainHeight(ship.position.x, ship.position.z) + 15;
                human.visible = true;
                playerYaw = ship.rotation.y;
            }
        }
        lastKeyE = currentKeyE;

        // L key - debounced - land ship
        const currentKeyL = keys["l"] || keys["L"];
        if (currentKeyL && !lastKeyL && controlMode === "in_ship") {
            ship.position.y = 10;
        }
        lastKeyL = currentKeyL;

        // T key - debounced - travel to new planet
        const currentKeyT = keys["t"] || keys["T"];
        if (currentKeyT && !lastKeyT && controlMode === "in_ship") {
            travelToNewPlanet();
        }
        lastKeyT = currentKeyT;

        // R key - debounced - roll
        const currentKeyR = keys["r"] || keys["R"];
        if (currentKeyR && !lastKeyR) {
            rolling = true;
            rollFrame = 0;
        }
        lastKeyR = currentKeyR;

        // Rolling animation
        if (rolling) {
            rollFrame++;
            if (rollFrame > 25) {
                rollResult = ironswornRoll(char.stats.Wits);
                lastReaction = randomChoice(oracles[currentSituation]);
                rolling = false;

                if (rollResult.text === "Strong Hit") {
                    char.progress = Math.min(10, char.progress + 3);
                    char.meters.Momentum = Math.min(10, char.meters.Momentum + 1);
                } else if (rollResult.text === "Weak Hit") {
                    char.progress = Math.min(10, char.progress + 1);
                    char.meters.Supply = Math.max(0, char.meters.Supply - 1);
                } else {
                    char.meters.Health = Math.max(0, char.meters.Health - 1);
                    char.meters.Momentum = Math.max(-6, char.meters.Momentum - 2);
                }
                updateHUD();

                // Generate and display context-aware effects
                clearEffects();
                generateEffectForRoll(currentSituation, rollResult.text);

                const diceEl = document.getElementById('dice');
                diceEl.style.display = 'block';
                document.getElementById('diceAction').textContent = rollResult.action;
                document.getElementById('diceC1').textContent = rollResult.c1;
                document.getElementById('diceC2').textContent = rollResult.c2;
                const outcomeColor = rollResult.text === "Strong Hit" ? "#0f0" : rollResult.text === "Weak Hit" ? "#ff0" : "#f00";
                document.getElementById('outcomeText').innerHTML = `<span style="color:${outcomeColor};">${rollResult.text}</span>`;
                document.getElementById('reaction').innerHTML = `<b>Reaction:</b><br>${lastReaction}`;
                document.getElementById('reaction').style.display = 'block';
            }
        }

        // Situation selection (these can be held down)
        if (keys["t"] || keys["T"]) currentSituation = "travel";
        if (keys["c"] || keys["C"]) currentSituation = "combat";
        if (keys["v"] || keys["V"]) currentSituation = "conversation";
        if (keys["o"] || keys["O"]) currentSituation = "obstacle";

        // Progress updates - throttled to every 30 frames
        lastProgressUpdate++;
        if (currentSituation === "travel" && (keys["ArrowUp"] || keys["ArrowDown"] || keys["ArrowLeft"] || keys["ArrowRight"]) && lastProgressUpdate > 30) {
            char.progress = Math.min(10, char.progress + 1);
            updateHUD();
            lastProgressUpdate = 0;
        }
    }

    // Camera positioning
    const camDistance = 150;
    const camX = target.position.x + Math.sin(playerYaw + Math.PI) * camDistance * Math.cos(cameraPitch);
    const camZ = target.position.z + Math.cos(playerYaw + Math.PI) * camDistance * Math.cos(cameraPitch);
    const camY = target.position.y + camDistance * Math.sin(cameraPitch) + (controlMode === "on_foot" ? 30 : 60);

    camera.position.x = camera.position.x * 0.85 + camX * 0.15;
    camera.position.y = camera.position.y * 0.85 + camY * 0.15;
    camera.position.z = camera.position.z * 0.85 + camZ * 0.15;
    camera.lookAt(target.position);

    renderer.render(scene, camera);
}

animate();

// Proper starting spawn - start in ship
human.position.set(80, 0, 40);
ship.position.set(80, 20, 40);
human.position.y = getTerrainHeight(human.position.x, human.position.z) + 15;
human.visible = false;

gameState = "playing";
document.getElementById('hud').style.display = 'block';
document.getElementById('status').style.display = 'block';
updateHUD();

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
