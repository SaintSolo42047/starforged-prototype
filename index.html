<script>
// Starforged 3D - full game with accessibility and render fixes
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight); // use full window
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x112211, 300, 2200);
scene.background = new THREE.Color(0x112244);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);

// lights and all other code (terrain, human, ship, oracles, char, etc.) stay exactly as in the previous full version
// ... (the entire script from my last full version goes here) ...

// Add resize handler at the end of the script
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
