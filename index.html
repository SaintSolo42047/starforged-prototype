<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Starforged 3D - The Perilous Void Edition</title>
    <style>
        body { margin:0; background:#000; font-family:Arial; color:#fff; overflow:hidden; }
        canvas { display:block; }
        #overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .hud { position:absolute; padding:10px; background:rgba(0,0,0,0.7); border:2px solid #0ff; border-radius:8px; font-size:12px; }
        #dice { position:absolute; bottom:20px; right:20px; background:rgba(0,0,0,0.7); padding:15px; border:2px solid #0ff; display:none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
    <main>
        <canvas id="canvas">3D Starship Navigation Screen - Starforged solo TTRPG game</canvas>
        <div id="overlay">
            <div id="hud" class="hud" style="top:10px; left:10px; width:240px; display:none;">
                <div id="meters"></div>
                <div id="progress" style="margin-top:10px;"></div>
                <div id="planetInfo" style="margin-top:10px; font-size:14px; color:#0ff;"></div>
            </div>

            <div id="status" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); padding:10px; border:2px solid #0ff; display:none;">
                Situation: <span id="situationText" style="color:#ff0;" aria-live="polite"></span>
            </div>
            <div id="reaction" style="position:absolute; top:80px; right:10px; background:rgba(0,0,0,0.7); padding:15px; max-width:300px; display:none; font-size:12px;"></div>

            <div id="dice">
                <div style="display:flex; gap:10px;">
                    <div id="diceAction" style="width:60px;height:60px;background:#ccc;color:#000;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid #000;"></div>
                    <div id="diceC1" style="width:60px;height:60px;background:#ccc;color:#000;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid #000;"></div>
                    <div id="diceC2" style="width:60px;height:60px;background:#ccc;color:#000;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid #000;"></div>
                </div>
                <div id="outcomeText" style="margin-top:8px;font-size:22px;text-align:center;"></div>
            </div>
        </div>
    </main>

<script>
// Complete Starforged 3D - blocky terrain, all controls, accessibility fixes
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x112211, 300, 2200);
scene.background = new THREE.Color(0x112244);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);

scene.add(new THREE.AmbientLight(0xaaaaaa, 1.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.8);
dirLight.position.set(200, 300, 100);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x88aaff, 1.6);
fillLight.position.set(-200, 150, -150);
scene.add(fillLight);
const hemiLight = new THREE.HemisphereLight(0xaaccff, 0x334422, 0.9);
scene.add(hemiLight);

// World types, terrain, villages, human, ship, char, oracles, etc.
const worldTypes = [
{name: "Barren World", color: 0x777777, heightVar: 3},
    {name: "Frozen World", color: 0xaaddff, heightVar: 4},
    {name: "Arid World", color: 0xffeecc, heightVar: 3},
    {name: "Oceanic World", color: 0x2288dd, heightVar: 2},
    {name: "Arboreal World", color: 0x44aa55, heightVar: 3.5},
    {name: "Earthlike World", color: 0x55bb66, heightVar: 3},
    {name: "Volcanic World", color: 0xdd7744, heightVar: 4.5},
    {name: "Metallic World", color: 0xaaaaaa, heightVar: 2.5}
];

let currentPlanet = {...worldTypes[5]};

const mapSize = 2000;
const blockSize = 32;
const gridSize = 64;
let terrainBlocks = [];

function getTerrainHeight(worldX, worldZ) {
  let height = Math.sin(worldX / 120) * currentPlanet.heightVar +
                 Math.sin(worldZ / 90) * (currentPlanet.heightVar * 0.8) +
                 Math.sin((worldX + worldZ) / 60) * (currentPlanet.heightVar * 0.5) +
                 Math.random() * 2 - 1;
    return Math.max(1, Math.floor(height)) * blockSize;
}

function generateTerrain() {
    terrainBlocks.forEach(b => scene.remove(b));
    terrainBlocks = [];
    for (let x = 0; x < gridSize; x++) {
        for (let z = 0; z < gridSize; z++) {
            const worldX = (x - gridSize/2) * blockSize;
            const worldZ = (z - gridSize/2) * blockSize;
            let heightBlocks = Math.max(1, Math.floor(
                Math.sin(worldX / 80) * currentPlanet.heightVar +
                Math.sin(worldZ / 55) * (currentPlanet.heightVar * 0.8) +
                Math.sin((worldX + worldZ) / 35) * (currentPlanet.heightVar * 0.6) +
                Math.random() * 4
            ));
            for (let y = 0; y < heightBlocks; y++) {
                const block = new THREE.Mesh(
                    new THREE.BoxGeometry(blockSize, blockSize, blockSize),
                    new THREE.MeshPhongMaterial({ color: currentPlanet.color, flatShading: true })
                );
                block.position.set(worldX, y * blockSize + blockSize/2, worldZ);
                scene.add(block);
                terrainBlocks.push(block);
            }
        }
    }
}
generateTerrain();

const villageGroup = new THREE.Group();
function generateVillages() {
    villageGroup.clear();
    for (let i = 0; i < 8; i++) {
        const villageX = (Math.random() - 0.5) * mapSize * 0.8;
        const villageZ = (Math.random() - 0.5) * mapSize * 0.8;
        const house = new THREE.Mesh(new THREE.BoxGeometry(30, 25, 30), new THREE.MeshPhongMaterial({ color: 0x884422 }));
        house.position.set(villageX, 12.5, villageZ);
        villageGroup.add(house);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(22, 15, 4), new THREE.MeshPhongMaterial({ color: 0x662211 }));
        roof.position.set(villageX, 32, villageZ);
        roof.rotation.y = Math.PI / 4;
        villageGroup.add(roof);
        for (let v = 0; v < 3; v++) {
            const villager = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 18, 8), new THREE.MeshPhongMaterial({ color: 0xffaa66 }));
            body.position.y = 15;
            villager.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(6, 12, 12), new THREE.MeshPhongMaterial({ color: 0xffddaa }));
            head.position.y = 30;
            villager.add(head);
            villager.position.set(villageX + (Math.random()-0.5)*40, 0, villageZ + (Math.random()-0.5)*40);
            villageGroup.add(villager);
        }
    }
    scene.add(villageGroup);
}
generateVillages();

const human = new THREE.Group();
const humanBody = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 20, 8), new THREE.MeshPhongMaterial({ color: 0x2288ff }));
humanBody.position.y = 15;
human.add(humanBody);
const humanHead = new THREE.Mesh(new THREE.SphereGeometry(8, 16, 16), new THREE.MeshPhongMaterial({ color: 0xffddaa }));
humanHead.position.y = 32;
human.add(humanHead);
scene.add(human);

const ship = new THREE.Group();
const shipBody = new THREE.Mesh(new THREE.ConeGeometry(18, 60, 4), new THREE.MeshPhongMaterial({ color: 0x00ffff }));
shipBody.rotation.x = Math.PI / 2;
ship.add(shipBody);
const shipWings = new THREE.Mesh(new THREE.BoxGeometry(80, 8, 18), new THREE.MeshPhongMaterial({ color: 0x0088ff }));
ship.add(shipWings);
scene.add(ship);

let gameState = "playing";
let controlMode = "on_foot";
let playerYaw = Math.PI;
let cameraPitch = 0.4;
let currentSituation = "travel";

const char = { 
    stats: { Edge: 2, Heart: 2, Iron: 2, Shadow: 2, Wits: 2 }, 
    meters: { Health: 5, Spirit: 5, Supply: 5, Momentum: 2 }, 
    progress: 0 
};

const oracles = {
    travel: ["Smooth hyperspace jump", "Pirate intercept", "Derelict signal", "Nebula interference"],
    combat: ["Enemy fighter engages", "Shield overload", "You gain targeting lock", "Hull breach sustained"],
    conversation: ["Station hails peacefully", "Captain demands tribute", "AI reveals coordinates", "Faction turns hostile"],
    obstacle: ["Asteroid field clears", "System glitch arises", "Partial scan success", "Full system failure with cost"]
};

let rollResult = null;
let lastReaction = "";
let rolling = false;
let rollFrame = 0;
let keys = {};
let lastProgressUpdate = 0;
let lastKeyE = false;
let lastKeyT = false;
let lastKeyL = false;
let lastKeyR = false;

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function randomChoice(arr) { 
    return arr[Math.floor(Math.random() * arr.length)]; 
}

function ironswornRoll(stat) {
    const action = Math.floor(Math.random() * 6) + 1;
    const c1 = Math.floor(Math.random() * 10) + 1;
    const c2 = Math.floor(Math.random() * 10) + 1;
    const total = action + stat;
    if (total > Math.max(c1, c2)) return {text: "Strong Hit", action, c1, c2};
    if (total > Math.min(c1, c2)) return {text: "Weak Hit", action, c1, c2};
    return {text: "Miss", action, c1, c2};
}

function updateHUD() {
    let html = '';
    Object.keys(char.meters).forEach(key => {
        const val = char.meters[key];
        const perc = key === "Momentum" ? ((val + 6) / 16 * 100) : (val / 5 * 100);
        const barColor = key === "Health" ? "#f00" : key === "Spirit" ? "#f0f" : key === "Supply" ? "#0f0" : "#0ff";
        html += `<div style="display:flex;align-items:center;margin:4px 0;"><span style="width:90px;">${key}: ${val}</span><div style="flex:1;background:#333;height:12px;border-radius:6px;overflow:hidden;"><div style="width:${perc}%;height:100%;background:${barColor};"></div></div></div>`;
    });
    document.getElementById('meters').innerHTML = html;
    
    const progressPerc = (char.progress / 10) * 100;
    document.getElementById('progress').innerHTML = `Progress: <span style="color:#0f0;">${char.progress}/10</span><div style="background:#333;height:14px;border-radius:7px;overflow:hidden;display:inline-block;width:180px;margin-left:10px;"><div style="width:${progressPerc}%;height:100%;background:#0f0;"></div></div>`;
    
    document.getElementById('planetInfo').innerHTML = `Planet: <span style="color:#ff0;">${currentPlanet.name}</span>`;
    document.getElementById('situationText').textContent = currentSituation.toUpperCase();
}

function travelToNewPlanet() {
    rollResult = ironswornRoll(char.stats.Wits);
    lastReaction = randomChoice(oracles.travel);
    const diceEl = document.getElementById('dice');
    diceEl.style.display = 'block';
    document.getElementById('diceAction').textContent = rollResult.action;
    document.getElementById('diceC1').textContent = rollResult.c1;
    document.getElementById('diceC2').textContent = rollResult.c2;
    
    const outcomeColor = rollResult.text === "Strong Hit" ? "#0f0" : rollResult.text === "Weak Hit" ? "#ff0" : "#f00";
    document.getElementById('outcomeText').innerHTML = `<span style="color:${outcomeColor};">${rollResult.text} - Jumping...</span>`;
    document.getElementById('reaction').innerHTML = `<b>Reaction:</b><br>${lastReaction}`;
    document.getElementById('reaction').style.display = 'block';

    if (rollResult.text === "Miss") return;

    currentPlanet = {...worldTypes[Math.floor(Math.random() * worldTypes.length)]};
    generateTerrain();
    generateVillages();
    updateHUD();

    ship.position.y = 80;
    setTimeout(() => { ship.position.y = 20; }, 800);
}

function animate() {
    requestAnimationFrame(animate);
    const speed = 5;
    const target = controlMode === "on_foot" ? human : ship;

    if (gameState === "playing") {
        // Rotation control with Shift
        if (keys["Shift"]) {
            if (keys["ArrowLeft"]) playerYaw -= 0.05;
            if (keys["ArrowRight"]) playerYaw += 0.05;
            target.rotation.y = playerYaw;
        }

        // Camera pitch control
        if (keys["q"] || keys["Q"]) cameraPitch = Math.min(1.2, cameraPitch + 0.03);
        if (keys["z"] || keys["Z"]) cameraPitch = Math.max(-0.6, cameraPitch - 0.03);

        // Movement calculations
        const forwardX = Math.sin(playerYaw);
        const forwardZ = Math.cos(playerYaw);
        const strafeX = Math.sin(playerYaw + Math.PI / 2);
        const strafeZ = Math.cos(playerYaw + Math.PI / 2);

        if (keys["ArrowUp"]) { target.position.x += forwardX * speed; target.position.z += forwardZ * speed; }
        if (keys["ArrowDown"]) { target.position.x -= forwardX * speed; target.position.z -= forwardZ * speed; }
        if (keys["ArrowLeft"]) { target.position.x += strafeX * speed * 0.7; target.position.z += strafeZ * speed * 0.7; }
        if (keys["ArrowRight"]) { target.position.x -= strafeX * speed * 0.7; target.position.z -= strafeZ * speed * 0.7; }

        // Terrain collision for on-foot
        if (controlMode === "on_foot") {
            const groundY = getTerrainHeight(target.position.x, target.position.z);
            target.position.y = groundY + 15;
        }

        // E key - debounced - enter/exit ship
        const currentKeyE = keys["e"] || keys["E"];
        if (currentKeyE && !lastKeyE) {
            if (controlMode === "on_foot") {
                const dist = human.position.distanceTo(ship.position);
                if (dist < 50) {
                    controlMode = "in_ship";
                    human.visible = false;
                    playerYaw = ship.rotation.y;
                }
            } else {
                controlMode = "on_foot";
                human.position.copy(ship.position);
                human.position.y = getTerrainHeight(ship.position.x, ship.position.z) + 15;
                human.visible = true;
                playerYaw = ship.rotation.y;
            }
        }
        lastKeyE = currentKeyE;

        // L key - debounced - land ship
        const currentKeyL = keys["l"] || keys["L"];
        if (currentKeyL && !lastKeyL && controlMode === "in_ship") {
            ship.position.y = 10;
        }
        lastKeyL = currentKeyL;

        // T key - debounced - travel to new planet
        const currentKeyT = keys["t"] || keys["T"];
        if (currentKeyT && !lastKeyT && controlMode === "in_ship") {
            travelToNewPlanet();
        }
        lastKeyT = currentKeyT;

        // R key - debounced - roll
        const currentKeyR = keys["r"] || keys["R"];
        if (currentKeyR && !lastKeyR) {
            rolling = true;
            rollFrame = 0;
        }
        lastKeyR = currentKeyR;

        // Rolling animation
        if (rolling) {
            rollFrame++;
            if (rollFrame > 25) {
                rollResult = ironswornRoll(char.stats.Wits);
                lastReaction = randomChoice(oracles[currentSituation]);
                rolling = false;

                if (rollResult.text === "Strong Hit") {
                    char.progress = Math.min(10, char.progress + 3);
                    char.meters.Momentum = Math.min(10, char.meters.Momentum + 1);
                } else if (rollResult.text === "Weak Hit") {
                    char.progress = Math.min(10, char.progress + 1);
                    char.meters.Supply = Math.max(0, char.meters.Supply - 1);
                } else {
                    char.meters.Health = Math.max(0, char.meters.Health - 1);
                    char.meters.Momentum = Math.max(-6, char.meters.Momentum - 2);
                }
                updateHUD();

                const diceEl = document.getElementById('dice');
                diceEl.style.display = 'block';
                document.getElementById('diceAction').textContent = rollResult.action;
                document.getElementById('diceC1').textContent = rollResult.c1;
                document.getElementById('diceC2').textContent = rollResult.c2;
                const outcomeColor = rollResult.text === "Strong Hit" ? "#0f0" : rollResult.text === "Weak Hit" ? "#ff0" : "#f00";
                document.getElementById('outcomeText').innerHTML = `<span style="color:${outcomeColor};">${rollResult.text}</span>`;
                document.getElementById('reaction').innerHTML = `<b>Reaction:</b><br>${lastReaction}`;
                document.getElementById('reaction').style.display = 'block';
            }
        }

        // Situation selection (these can be held down)
        if (keys["t"] || keys["T"]) currentSituation = "travel";
        if (keys["c"] || keys["C"]) currentSituation = "combat";
        if (keys["v"] || keys["V"]) currentSituation = "conversation";
        if (keys["o"] || keys["O"]) currentSituation = "obstacle";

        // Progress updates - throttled to every 30 frames
        lastProgressUpdate++;
        if (currentSituation === "travel" && (keys["ArrowUp"] || keys["ArrowDown"] || keys["ArrowLeft"] || keys["ArrowRight"]) && lastProgressUpdate > 30) {
            char.progress = Math.min(10, char.progress + 1);
            updateHUD();
            lastProgressUpdate = 0;
        }
    }

    // Camera positioning
    const camDistance = 150;
    const camX = target.position.x + Math.sin(playerYaw + Math.PI) * camDistance * Math.cos(cameraPitch);
    const camZ = target.position.z + Math.cos(playerYaw + Math.PI) * camDistance * Math.cos(cameraPitch);
    const camY = target.position.y + camDistance * Math.sin(cameraPitch) + (controlMode === "on_foot" ? 30 : 60);

    camera.position.x = camera.position.x * 0.85 + camX * 0.15;
    camera.position.y = camera.position.y * 0.85 + camY * 0.15;
    camera.position.z = camera.position.z * 0.85 + camZ * 0.15;
    camera.lookAt(target.position);

    renderer.render(scene, camera);
}

animate();

// Proper starting spawn
human.position.set(0, 0, 0);
ship.position.set(80, 20, 40);
human.position.y = getTerrainHeight(human.position.x, human.position.z) + 15;

gameState = "playing";
document.getElementById('hud').style.display = 'block';
document.getElementById('status').style.display = 'block';
updateHUD();

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
